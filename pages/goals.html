<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goals · LevelUp</title>
  <link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/storage.js" defer></script>
  <script src="../js/app.js" defer></script>
  <script src="../js/goals.js" defer></script>
</head>
<body data-page="goals" data-root="..">
  <a class="skip-link" href="#main-content">跳转到主要内容</a>
  <div id="sidebar-root"></div>
  <div class="workspace">
    <div id="header-root"></div>
    <main id="main-content" tabindex="-1">
      <section class="page-heading">
        <div><p class="eyebrow">GOALS / MAKE IT HAPPEN</p><h1>让目标，有一个方向。</h1><p class="muted">从模糊的愿望，到可以一步步靠近的目标。</p></div>
        <span class="phase-badge"><span class="status-dot"></span> PHASE 02 · 目标管理</span>
      </section>
      <section class="goal-summary" aria-label="目标统计">
        <div class="panel"><span class="muted">全部目标</span><strong id="goals-total">—</strong></div>
        <div class="panel"><span class="muted">进行中</span><strong id="goals-active">—</strong></div>
        <div class="panel"><span class="muted">已完成</span><strong id="goals-completed">—</strong></div>
      </section>
      <p id="goals-status" class="goals-status" role="status" aria-live="polite">目标只保存在当前浏览器。</p>
      <div class="goals-layout">
        <section class="panel goal-editor" id="create-goal" aria-labelledby="editor-title">
          <p class="eyebrow">ONE GOAL AT A TIME</p>
          <h2 id="editor-title">添加一个小目标</h2>
          <p class="muted editor-intro">写清楚你想做的事，比追求完美更重要。</p>
          <form id="goal-form">
            <label for="goal-title">目标名称 <span class="accent">*</span></label>
            <input id="goal-title" name="title" required maxlength="80" placeholder="例如：本月读完一本书">
            <label for="goal-description">目标描述 <span class="muted">选填 · 最多 500 字</span></label>
            <textarea id="goal-description" name="description" maxlength="500" rows="4" placeholder="为什么想完成它？怎样算完成？"></textarea>
            <div class="goal-form-row">
              <div><label for="goal-category">成长领域</label><select id="goal-category" name="category"><option>学习</option><option>健康</option><option>生活</option><option>其他</option></select></div>
              <div><label for="goal-date">截止日期 <span class="muted">选填</span></label><input type="date" id="goal-date" name="dueDate" min="0001-01-01" max="9999-12-31"></div>
            </div>
            <p id="goal-form-error" class="form-error" role="alert"></p>
            <div class="goal-form-actions"><button id="save-goal" class="button button-primary" type="submit">保存目标 <span aria-hidden="true">↗</span></button><button id="cancel-edit" class="button button-secondary" type="button" hidden>取消编辑</button></div>
          </form>
        </section>
        <section class="goals-collection" aria-labelledby="list-title">
          <div class="section-top"><div><p class="eyebrow">YOUR NEXT STEPS</p><h2 id="list-title">我的目标</h2></div><span class="tiny-tag">本地保存</span></div>
          <div class="goal-filters" role="group" aria-label="筛选目标状态"><button class="filter-button active" data-filter="all" aria-pressed="true">全部</button><button class="filter-button" data-filter="active" aria-pressed="false">进行中</button><button class="filter-button" data-filter="completed" aria-pressed="false">已完成</button><button class="filter-button" data-filter="trash" aria-pressed="false">回收站</button></div>
          <p id="goal-list-caption" class="muted list-caption"></p>
          <div id="goal-list" class="goal-list"></div>
        </section>
      </div>
      <div id="footer-root"></div>
    </main>
  </div>
  <noscript><div class="noscript-message">请启用 JavaScript，以使用目标管理和本地保存。</div></noscript>
</body>
</html>
